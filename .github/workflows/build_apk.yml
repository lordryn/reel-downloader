name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK with Buildozer
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Buildozer Directories
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v6-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake libltdl-dev \
            libsqlite3-dev libjpeg-dev

      - name: Install Python Build Tools
        run: |
          pip install --upgrade "pip<25" setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Build Debug APK
        run: |
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-downloader-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_meta
        if: github.event_name != 'pull_request'
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -E '^\s*version\s*=' buildozer.spec | head -n1 | awk -F '=' '{print $2}' | tr -d '[:space:]')
            TAG="v${VERSION:-1.0.0}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "Reel Downloader ${{ steps.release_meta.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
